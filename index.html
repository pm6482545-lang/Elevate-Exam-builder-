<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevate Exam Builder | KNEC & CBC Standard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Elevate Exam Builder</h1>
        <p class="text-slate-600 mb-6">Generate strict, curriculum-compliant Kenyan national assessments (KPSEA/KJSEA).</p>

        <!-- Selection Form -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Select Grade</label>
                <select id="gradeSelect" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white">
                    <option value="">-- Choose Grade --</option>
                    <option value="Grade 4">Grade 4</option>
                    <option value="Grade 5">Grade 5</option>
                    <option value="Grade 6">Grade 6 (KPSEA Style)</option>
                    <option value="Grade 7">Grade 7 (KJSEA Style)</option>
                    <option value="Grade 8">Grade 8 (KJSEA Style)</option>
                    <option value="Grade 9">Grade 9 (KJSEA Style)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Select Subject (Learning Area)</label>
                <select id="subjectSelect" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white">
                    <option value="">-- Choose Subject --</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="English">English</option>
                    <option value="Kiswahili">Kiswahili</option>
                    <option value="Integrated Science">Integrated Science</option>
                    <option value="Social Studies">Social Studies</option>
                    <option value="Christian Religious Education">Christian Religious Education</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Assessment Standard</label>
                <select id="blueprintSelect" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white">
                    <option value="KPSEA">KPSEA Standard (Primary)</option>
                    <option value="KJSEA">KJSEA Standard (Junior School)</option>
                </select>
            </div>
        </div>

        <!-- Custom Prompt & Image Inputs -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Custom Examiner Instructions / Focus</label>
                <input type="text" id="customPrompt" placeholder="e.g., Focus heavily on word problems and algebra..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" />
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Include Image Files (Comma separated)</label>
                <input type="text" id="imageFilenames" placeholder="e.g., triangle1.png, graph.png" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-mono" />
            </div>
        </div>

        <button id="fetchCurriculumBtn" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">
            Generate KNEC Exam in LaTeX
        </button>

        <!-- Results Display Box -->
        <div class="mt-8">
            <h2 class="text-lg font-semibold text-slate-800 mb-2">Generated Exam & LaTeX Code</h2>
            <div id="outputArea" class="border border-slate-200 bg-slate-50 rounded-lg p-4 min-h-[150px] text-slate-600 text-sm">
                Select options above, specify custom instructions or images, and generate your master LaTeX code.
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
